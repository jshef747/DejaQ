[project]
name = "dejaq-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "fastapi>=0.129.0",
    "huggingface-hub>=1.4.1",
    "llmlingua>=0.2.2",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "torch>=2.10.0",
    "transformers>=5.1.0",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
    "chromadb>=0.6.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=3.0.0",
    "openai>=2.31.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "click>=8.3.2",
    "rich>=14.3.3",
    "aiosqlite>=0.22.1",
    "cryptography>=46.0.6",
    "anthropic>=0.97.0",
    "aiohttp>=3.13.5",
    # PDF text extraction for the file gate. pure-Python and MIT, unlike pymupdf
    # (AGPL) — and we only need the characters, since they are hashed immediately
    # rather than laid out, so pymupdf's speed and pdfplumber's table handling buy
    # nothing here.
    "pypdf>=6.0.0",
    # DOCX text extraction for the file gate. MIT, matching the pypdf choice
    # above — no AGPL dependency for a feature this small.
    "python-docx>=1.1.0",
    # Used by services/image_fingerprint.py, which imported it while it was in
    # neither pyproject.toml nor uv.lock — the venv worked only by accident.
    "pillow>=11.0.0",
    # RAG (Rug) knowledge layer: HTML→text for URL ingestion (services/rag_ingest.py).
    # MIT-licensed, lightweight — no AGPL dependency, matching the pypdf choice above.
    "beautifulsoup4>=4.12.0",
    # Required by FastAPI to parse multipart/form-data — the RAG document upload
    # endpoint (routers/admin/rag_documents.py) uses UploadFile/Form.
    "python-multipart>=0.0.9",
    # LiteLLM provider transport (migration L0). Pinned with `==`, never a
    # range: this dependency ships multiple releases a week and every call
    # site relies on specific exception-mapping and retry behaviour measured
    # against this exact version. Bump deliberately, not on a `uv sync`.
    "litellm==1.97.0",
]

[project.scripts]
dejaq-admin = "cli.admin:cli"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[dependency-groups]
test = ["pytest>=8.0", "pytest-html>=4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--html=test_reports/report.html --self-contained-html -v"
markers = [
    "no_model: no ML model needed",
    "qwen: requires Qwen 0.5B",
    "qwen_1_5b: requires Qwen 1.5B",
    "phi: requires Phi-3.5 Mini",
    "gemma_e2b: requires Gemma 4 E2B",
    "llama: requires Gemma 4 26B A4B",
    "deberta: requires NVIDIA DeBERTa",
]
